[package]
name = "mote"
version = "0.1.0"
edition = "2024"
description = "ASCII wireframe renderer and terminal greeter"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fontdue = "0.9"
ratatui = { version = "0.30", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
sha2 = "0.11"
toml = "1"
