[package]
name = "mote"
version = "0.1.0"
edition = "2024"
description = "ASCII wireframe renderer and terminal greeter"
license = "MIT"

[dependencies]
anyhow = "1"
ratatui = { version = "0.30", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
toml = "1"
